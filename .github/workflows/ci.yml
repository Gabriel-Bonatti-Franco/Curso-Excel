name: CI - Continuous Integration

on:
  push:
    branches: [ "main" , "feature" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Initial Debug
        run: |
          echo "Checking files..."
          ls -la

      # HTML code validation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install HTMLHint, StyleLint and ESLint
        run: |
          npm install -g \
            htmlhint@1 \
            eslint@8 \
            stylelint@15 \
            stylelint-config-standard@34

      - name: HTML Validation
        run: | 
          # HTML Validation
          echo "========== VALIDATING HTML =========="
          htmlhint "**/*.html" --config config/.htmlhintrc

      - name: CSS Validation
        run: | 
          # CSS Validation
          # List all .css files and check if at least 1 exists
          if find . -name "*.css" | grep -q .; then

            echo "========== VALIDATING CSS =========="

            stylelint "**/*.css" \
              --config config/.stylelintrc.json \
              --config-basedir .

          else
            echo "No .css files found"
          fi
      
      - name: JavaScript Validation
        run: | 
          # JavaScript Validation
          # List all .js files and check if at least 1 exists
          if find . -name "*.js" | grep -q .; then
            echo "========== VALIDATING JAVASCRIPT =========="
            eslint "**/*.js" --config config/.eslintrc.json
          else
            echo "No .js files found"
          fi       

      - name: Validating File Structure
        run: |
          echo "In Development"

          echo "========== VALIDATING STRUCTURE =========="

          # Main file index.html
          [ -f "index.html" ] || (echo "index.html not found" && exit 1)

          # Required folders
          [ -d "pages" ] || (echo "pages folder not found" && exit 1)
          [ -d "config" ] || (echo "config folder not found" && exit 1)
          [ -d "src" ] || (echo "src folder not found" && exit 1)

          # src subfolders
          [ -d "src/components" ] || (echo "src/components not found" && exit 1)
          [ -d "src/images" ] || (echo "src/images not found" && exit 1)
          [ -d "src/scripts" ] || (echo "src/scripts not found" && exit 1)
          [ -d "src/styles" ] || (echo "src/styles not found" && exit 1)

          echo "Structure OK"
