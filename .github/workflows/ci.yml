name: CI - Continuous Integration

on:
  push:
    branches: [ "main" , "feature" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Debug Inicial
        run: |
          echo "Verificando arquivos..."
          ls -la

      # Validação do código HTML
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar HTMLHint, StyleLint e ESLint
        run: |
          npm install -g htmlhint@1 stylelint@15 eslint@8

      - name: Validar Código HTML
        run: | 
          htmlhint "**/*.html"

      - name: Validar Código CSS
        run: | 
          # Lista todos os arquivos .css e verifica se existe pelo menos 1
          if find . -name "*.css" | grep -q .; then
            echo "Validando css..."
            stylelint "**/*.css"
          else
            echo "Nenhum arquivo CSS encontrado"
          fi
      
      - name: Validar Código JavaScript
        run: | 
          # Lista todos os arquivos .js e verifica se existe pelo menos 1
          if find . -name "*.js" | grep -q .; then
            echo "Validando JavaScript..."
            eslint "**/*.js"
          else
            echo "Nenhum arquivo JS encontrado"
          fi       
