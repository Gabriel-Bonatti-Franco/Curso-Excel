<!DOCTYPE html>
<style>
    #content{
        display: flex;
        flex-direction: row;
        gap: 24px;
        margin: 24px;
    }

    #content .card{
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 124px;
        border-radius: 12px;
        
        background-color: #e4f1eb;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.25);
        
        padding: 12px 24px;
        text-align: center;

        justify-content: center;
        align-items: center;
    }

    #content .card:hover{
        transform: translateY(-8px);
        transition: 0.5s;
    }

    /*
        verde-escuro: #013018
        verde-claro: #0fa15a
    */

    #content .card>.group{
        background-color: rgba(15, 163, 92, 0.25);
        padding: 4px 8px;
        border-radius: 8px;
    }

</style>
<div id="content">

</div>
