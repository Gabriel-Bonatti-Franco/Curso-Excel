<!DOCTYPE html>
<style>
    #content{
        display: flex;
        flex-direction: row;
        gap: 24px;
        margin: 24px;
    }

    #content *{
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 164px;
        border-radius: 12px;
        
        background-color: #e4f1eb;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.25);

        justify-content: center;
        align-items: center;
    }

    #content *:hover{
        transform: translateY(-8px);
        transition: 0.5s;
    }

</style>
<div id="content">

</div>
